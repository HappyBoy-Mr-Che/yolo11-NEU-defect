#澧炲姞灏忕洰鏍囨娴嬪眰

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2_IDC, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2_IDC, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2_IDC, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2_IDC, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# YOLO11n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2_IDC, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2_IDC, [256, False]] # 16 (P3/8-small)


  - [ -1, 1, nn.Upsample, [ None, 2, "nearest" ] ]
  - [ [ -1, 2 ], 1, Concat, [ 1 ] ]
  - [ -1, 2, C3k2_IDC, [ 128, False ] ]# 19
  - [ -1, 1, SCSABlock, [  4 ] ] #20



  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 16, 4], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2_IDC, [512, False]] # 23 (P4/16-medium)
  - [ -1, 1, SCSABlock, [  8 ] ] #24

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 13, 6], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2_IDC, [512, False]] # 27 (P5/32-large)
  - [ -1, 1, SCSABlock, [ 16 ] ]#28


  - [ -1, 1, Conv, [ 512, 3, 2 ] ]
  - [ [ -1, 10 ], 1, Concat, [ 1 ] ] # cat head P5
  - [ -1, 2, C3k2_IDC, [ 1024, True ] ]#31







  - [[19, 23, 27, 31] ,1, Detect, [nc]] # Detect(P3, P4, P5)


